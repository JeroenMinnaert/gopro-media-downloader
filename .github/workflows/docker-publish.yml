name: Docker Publish

# Triggered by CI's completion rather than by push directly, so a build
# only ever gets published once the full test matrix has passed on main --
# push and this workflow both firing on the same push event would give no
# such ordering guarantee.
on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

# A new push supersedes an in-flight publish of the same branch.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # `workflow_run`'s `branches:` filter matches the *head* branch of the
    # triggering run, and CI also runs on pull_request -- a fork's own `main`
    # would satisfy it. So the origin is re-checked here: only a push to this
    # repository's main may publish, never a PR from a fork.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          # amd64 covers most desktops/servers; arm64 covers NAS boxes and
          # Apple Silicon dev machines. Drop arm64 here if you know your NAS
          # is x86 -- it's emulated via QEMU and is the slower half of the
          # build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gopro-media-downloader:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gopro-media-downloader:${{ github.event.workflow_run.head_sha || github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
