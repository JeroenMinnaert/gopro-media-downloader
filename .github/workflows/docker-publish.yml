name: Docker Publish

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "docker/**"
      - "src/**"
      - "pyproject.toml"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

# A new push supersedes an in-flight publish of the same branch.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          # amd64 covers most desktops/servers; arm64 covers NAS boxes and
          # Apple Silicon dev machines. Drop arm64 here if you know your NAS
          # is x86 -- it's emulated via QEMU and is the slower half of the
          # build.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/gopro-media-downloader:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/gopro-media-downloader:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
