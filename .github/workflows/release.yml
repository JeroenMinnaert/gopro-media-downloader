name: Release

# Tags only. A dispatch from a branch could otherwise run the whole matrix and
# the build before being turned away at the publish step, which the `pypi`
# environment now restricts to `v*` tags anyway.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # A tag name does not set the version -- hatch reads __version__ -- so a tag
  # that disagrees with the code builds an already-published version and only
  # finds out at the upload, after the whole matrix has run. Seconds here
  # instead.
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The tag must match __version__
        run: |
          tag="${GITHUB_REF_NAME#v}"
          code="$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/gopro_dl/__init__.py)"
          if [ "$tag" != "$code" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match __version__ ${code}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} matches __version__ ${code}"

  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip build
      - run: python -m build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted publishing (OIDC) -- no PyPI API token/secret needed.
      # Configure this repo as a trusted publisher at
      # https://pypi.org/manage/project/gopro-media-downloader/settings/publishing/
      # before the first tag push, using environment name "pypi".
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
