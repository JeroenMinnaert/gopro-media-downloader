name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run of the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - name: ruff
        run: ruff check src tests

  test:
    strategy:
      fail-fast: false
      matrix:
        # macOS is not incidental: the free-space check parses `df` because
        # smbfs truncates statvfs, and that path only exists on Darwin.
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"

      - name: Tests
        # The suite is fully mocked -- no network, no GoPro token. The timeout
        # stops a threading regression from hanging the job for six hours.
        run: pytest -q --timeout=120

      - name: CLI smoke test
        # Catches packaging breakage that the tests would not: entry point
        # missing, imports failing outside the source tree.
        run: |
          cd "$(mktemp -d)"
          gopro-dl --help
          gopro-dl sync --help
          gopro-dl verify --help
          gopro-dl backfill-etags --help

      - name: No token can be resolved from a clean environment
        # Guards the config precedence: without GOPRO_* or a config file the
        # tool must refuse rather than silently reach for something
        # unexpected. GOPRO_DL_HOME is forced too: this editable install
        # would otherwise auto-detect the checkout as a dev sandbox (see
        # appdirs.py), which resolves from __file__, not HOME -- pinning it
        # keeps this check deterministic regardless of that detection.
        run: |
          cd "$(mktemp -d)"
          if HOME="$(mktemp -d)" GOPRO_DL_HOME="$(mktemp -d)" gopro-dl token; then
            echo "expected a clean environment to have no usable token"; exit 1
          fi
