[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopro-media-downloader"
version = "0.1.0"
description = "Hardened, resumable downloader for the GoPro Plus cloud media library"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-timeout>=2.3",
]

[project.scripts]
gopro-dl = "gopro_dl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gopro_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
