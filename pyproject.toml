[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopro-media-downloader"
version = "0.1.0"
description = "Hardened, resumable downloader for the GoPro Plus cloud media library"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.scripts]
gopro-dl = "gopro_dl.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gopro_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "C4", "RUF"]
ignore = [
    "E501",     # long lines: the existing style runs to ~100, enforced by formatter not linter
    "RUF059",   # unused unpacked variable reads fine in tests
    "PYI034",   # __enter__ returning the concrete class is intentional and clear
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # len() in a test helper default is deliberate and harmless
