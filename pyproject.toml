[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gopro-media-downloader"
dynamic = ["version"]
description = "Hardened, resumable downloader for the GoPro Plus cloud media library"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Jeroen Minnaert", email = "2262843+JeroenMinnaert@users.noreply.github.com" },
]
keywords = ["gopro", "gopro-plus", "backup", "downloader", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia",
    "Topic :: System :: Archiving :: Backup",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "playwright>=1.40",
    "platformdirs>=4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "pytest-timeout>=2.3",
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/JeroenMinnaert/gopro-media-downloader"
Repository = "https://github.com/JeroenMinnaert/gopro-media-downloader"
Issues = "https://github.com/JeroenMinnaert/gopro-media-downloader/issues"
Documentation = "https://github.com/JeroenMinnaert/gopro-media-downloader/blob/main/docs/README.md"
Changelog = "https://github.com/JeroenMinnaert/gopro-media-downloader/blob/main/CHANGELOG.md"

[project.scripts]
gopro-dl = "gopro_dl.cli:main"

[tool.hatch.version]
path = "src/gopro_dl/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/gopro_dl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "C4", "RUF"]
ignore = [
    "E501",     # long lines: the existing style runs to ~100, enforced by formatter not linter
    "RUF059",   # unused unpacked variable reads fine in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B008"]  # len() in a test helper default is deliberate and harmless
